services:

  backend:
    build: ./backend
    container_name: hybrid-rag-backend

    env_file:
      - .env

    environment:
      DATA_DIR: /app/hybrid_rag_data

    volumes:
      - ./hybrid_rag_data:/app/hybrid_rag_data

    ports:
      - "127.0.0.1:8000:8000"

    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: hybrid-rag-frontend

    environment:
      API_URL: http://backend:8000

    ports:
      - "127.0.0.1:8501:8501"

    depends_on:
      - backend

    restart: unless-stopped